name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Creating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass android \
              -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK generated
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Verify launcher activity is present in APK
        run: |
          python3 - <<'PY'
          import sys, zipfile

          apk = "app/build/outputs/apk/debug/app-debug.apk"
          needle = b"Lcom/badr/quranstudio/ui/MainActivity;"
          with zipfile.ZipFile(apk) as z:
              dex_files = [n for n in z.namelist() if n.startswith("classes") and n.endswith(".dex")]
              found = [n for n in dex_files if needle in z.read(n)]

          print("dex files:", dex_files)
          print("launcher activity found in:", found)
          if not found:
              print("ERREUR: .ui.MainActivity absente de l'APK -> crash au lancement", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: badr-quran-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
